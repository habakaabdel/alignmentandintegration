<style>
  @font-face {
    font-family: 'Plus Jakarta Sans';
    font-weight: 300 700;
    font-display: swap;
    src: url('/media/fonts/plus-jakarta-sans-latin-var.woff2') format('woff2');
  }
  @font-face {
    font-family: 'IBM Plex Mono';
    font-weight: 400;
    font-display: swap;
    src: url('/media/fonts/ibm-plex-mono-latin-400.woff2') format('woff2');
  }
  :root {
    --paper: #f7f6f2;
    --panel: #ffffff;
    --ink: #1c1d1c;
    --ink-muted: #5e605d;
    --mark: #2d4a3e;
    --mark-deep: #1d332a;
    --second: #3a5a40;
    --line: #d8d6ce;
    --sans: "Plus Jakarta Sans", ui-sans-serif, system-ui, sans-serif;
    --mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", monospace;
  }
  * { box-sizing: border-box; margin: 0; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    min-height: 100vh;
    min-height: 100dvh;
    display: grid;
    place-items: center;
    grid-template-columns: minmax(0, 1fr);
    padding: 24px 16px calc(24px + env(safe-area-inset-bottom));
    background: var(--paper);
    color: var(--ink);
    font-family: var(--sans);
    line-height: 1.4;
  }
  .card {
    width: 100%;
    max-width: 380px;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 24px 4px 24px 4px;
    padding: 32px 20px 24px;
    text-align: center;
  }
  .monogram { width: 72px; height: 72px; display: block; margin: 0 auto 20px; }
  h1 { font-size: 1.75rem; font-weight: 650; letter-spacing: -0.01em; }
  .role { margin-top: 4px; color: var(--ink-muted); font-size: 1rem; }
  .actions { display: grid; gap: 10px; margin-top: 28px; }
  .btn {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    min-height: 52px;
    padding: 0 12px;
    border-radius: 999px;
    font: 600 1rem/1 var(--sans);
    text-decoration: none;
    border: 1px solid var(--mark);
    color: var(--mark);
    background: var(--panel);
    -webkit-tap-highlight-color: transparent;
  }
  .btn svg { width: 20px; height: 20px; flex: none; }
  .btn > span { min-width: 0; }
  .btn-primary { background: var(--mark); color: #fff; }
  .btn:active { transform: scale(0.98); }
  .btn-primary:active { background: var(--mark-deep); }
  .detail { display: block; margin-top: 2px; font: 400 0.6875rem/1.2 var(--mono); color: var(--ink-muted); overflow-wrap: anywhere; }
  .qr { margin-top: 28px; padding-top: 24px; border-top: 1px solid var(--line); }
  .qr img { width: 168px; height: 168px; display: block; margin: 0 auto; }
  .qr p { margin-top: 10px; font: 400 0.75rem/1.3 var(--mono); color: var(--ink-muted); }
</style>
</head>
<body>

<main class="card">
  <svg class="monogram" viewBox="0 0 48 48" role="img" aria-label="Alignment Integration monogram">
    <path d="M35.5 6.4 A21 21 0 1 0 44.1 18.5" fill="none" stroke="#2d4a3e" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="41" cy="11.7" r="2.6" fill="#3a5a40"/>
    <path d="M24 38 C24 30 24 27 24 23" fill="none" stroke="#2d4a3e" stroke-width="2.7" stroke-linecap="round"/>
    <path d="M24 24 C16.5 24 12.5 19 12 12 C19 12.5 24 16.5 24 24 Z" fill="#2d4a3e"/>
    <path d="M24.5 22 C25.5 16.5 29 13.5 34.5 13 C34 18.5 31 22 25.5 23" fill="none" stroke="#2d4a3e" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
    <circle cx="12" cy="12" r="2.4" fill="#3a5a40"/>
  </svg>

  <h1>Abdel Habaka</h1>
  <p class="role">Director, Alignment Integration</p>

  <div class="actions">
    <a class="btn btn-primary" href="/card/abdel-habaka.vcf" download="Abdel Habaka.vcf">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M19 8v6M22 11h-6"/></svg>
      Save contact
    </a>
    <a class="btn" href="mailto:director@alignmentandintegration.com">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="m22 7-10 6L2 7"/></svg>
      <span>Email<span class="detail">director@alignmentandintegration.com</span></span>
    </a>
    <a class="btn" href="/">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M2 12h20M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg>
      <span>Website<span class="detail">alignmentandintegration.com</span></span>
    </a>
  </div>

  <div class="qr">
    <img src="/card/qr.svg" alt="QR code that opens this card">
    <p>Scan to open this card</p>
  </div>
</main>

</body>
</html>
