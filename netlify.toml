[build]
  publish = "."

[[redirects]]
  from = "https://align-n-integrate.com/*"
  to = "https://alignmentandintegration.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://www.align-n-integrate.com/*"
  to = "https://alignmentandintegration.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "/demos/emhware-portal/*"
  to = "/demos/emr-portal/:splat"
  status = 301

[[redirects]]
  from = "/demos/hart-hub-portal/*"
  to = "/demos/community-hub-portal/:splat"
  status = 301

[[redirects]]
  from = "/therapists/*"
  to = "/"
  status = 301

[[redirects]]
  from = "/individuals/*"
  to = "/"
  status = 301

[[redirects]]
  from = "/videos/holistics/*"
  to = "/video/"
  status = 301

[[redirects]]
  from = "/videos/references/*"
  to = "/video/"
  status = 301

# Service pages, November 2026: one landing page per service. The organizations
# page became /reporting/ and the videos page became /video/. The sample
# diagnosis stays at /organizations/sample-diagnosis/, so the first rule is
# exact rather than a splat.
[[redirects]]
  from = "/community-social-services/*"
  to = "/reporting/"
  status = 301

[[redirects]]
  from = "/ai-readiness/*"
  to = "/"
  status = 301

[[redirects]]
  from = "/organizations/"
  to = "/reporting/"
  status = 301

[[redirects]]
  from = "/videos/*"
  to = "/video/:splat"
  status = 301

[[redirects]]
  from = "/demos/therapist-workload/*"
  to = "/demos/"
  status = 301

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

# Digital business card: iPhone opens the Contacts sheet only with this type.
[[headers]]
  for = "/card/*.vcf"
  [headers.values]
    Content-Type = "text/vcard; charset=utf-8"

[[redirects]]
  from = "/small-business/*"
  to = "/demos/restaurant-ops/"
  status = 301

[[redirects]]
  from = "/enterprise/*"
  to = "/reporting/"
  status = 301

[[redirects]]
  from = "/students/*"
  to = "/"
  status = 301

[[redirects]]
  from = "/students"
  to = "/"
  status = 301

[[redirects]]
  from = "/demos/personal-pal/*"
  to = "/demos/"
  status = 301

[[redirects]]
  from = "/README.md"
  to = "/404"
  status = 404
  force = true

[[redirects]]
  from = "/design.md"
  to = "/404"
  status = 404
  force = true

[[redirects]]
  from = "/HANDOFF.md"
  to = "/404"
  status = 404
  force = true

[[redirects]]
  from = "/brand/NOTES.md"
  to = "/404"
  status = 404
  force = true

[[redirects]]
  from = "/docs/*"
  to = "/404"
  status = 404
  force = true

# The publish root is the repo root, so the Reference Check function's source,
# tests and package files would otherwise be served as static files.
[[redirects]]
  from = "/server/*"
  to = "/404"
  status = 404
  force = true

[[redirects]]
  from = "/netlify/*"
  to = "/404"
  status = 404
  force = true

[[redirects]]
  from = "/node_modules/*"
  to = "/404"
  status = 404
  force = true

[[redirects]]
  from = "/package.json"
  to = "/404"
  status = 404
  force = true

[[redirects]]
  from = "/package-lock.json"
  to = "/404"
  status = 404
  force = true

# Marks the HTML pages for a visitor Netlify places in Quebec (one attribute on
# the html tag), so the visitor identification loader in main.js stays off for
# them until they turn it on. Files with an extension stay with the CDN.
[[edge_functions]]
  path = "/*"
  excludedPath = ["/mcp", "/media/*", "/vendor/*", "/brand/*", "/*.css", "/*.js", "/*.mjs", "/*.svg", "/*.png", "/*.jpg", "/*.jpeg", "/*.webp", "/*.gif", "/*.ico", "/*.xml", "/*.txt", "/*.json", "/*.woff", "/*.woff2", "/*.mp4", "/*.webm", "/*.pdf", "/*.vcf", "/*.md"]
  function = "visitor-region"
