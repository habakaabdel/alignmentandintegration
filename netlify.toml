[build]
  publish = "."

[[redirects]]
  from = "https://align-n-integrate.com/*"
  to = "https://alignmentandintegration.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://www.align-n-integrate.com/*"
  to = "https://alignmentandintegration.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "/demos/emhware-portal/*"
  to = "/demos/emr-portal/:splat"
  status = 301

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
