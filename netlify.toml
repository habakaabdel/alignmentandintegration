[build]
  publish = "."

[[redirects]]
  from = "https://align-n-integrate.com/*"
  to = "https://alignmentandintegration.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://www.align-n-integrate.com/*"
  to = "https://alignmentandintegration.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "/demos/emhware-portal/*"
  to = "/demos/emr-portal/:splat"
  status = 301

[[redirects]]
  from = "/demos/hart-hub-portal/*"
  to = "/demos/community-hub-portal/:splat"
  status = 301

[[redirects]]
  from = "/therapists/*"
  to = "/"
  status = 301

[[redirects]]
  from = "/demos/therapist-workload/*"
  to = "/demos/"
  status = 301

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

[[redirects]]
  from = "/small-business/*"
  to = "/demos/restaurant-ops/"
  status = 301

[[redirects]]
  from = "/enterprise/*"
  to = "/organizations/"
  status = 301

[[redirects]]
  from = "/students/*"
  to = "/"
  status = 301

[[redirects]]
  from = "/students"
  to = "/"
  status = 301

[[redirects]]
  from = "/demos/personal-pal/*"
  to = "/demos/"
  status = 301

[[redirects]]
  from = "/README.md"
  to = "/404"
  status = 404
  force = true

[[redirects]]
  from = "/design.md"
  to = "/404"
  status = 404
  force = true

[[redirects]]
  from = "/HANDOFF.md"
  to = "/404"
  status = 404
  force = true

[[redirects]]
  from = "/brand/NOTES.md"
  to = "/404"
  status = 404
  force = true

[[redirects]]
  from = "/docs/*"
  to = "/404"
  status = 404
  force = true
