<!DOCTYPE html>
<html lang="en-CA">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Staff portal demonstration over a clinical EMR</title>
<meta name="description" content="Demonstration of a clinical staff portal built over an electronic medical record system, by Alignment Integration. Fictional agency, fictional data.">
<meta name="robots" content="index, follow">
<meta name="theme-color" content="#17566B">
<link rel="icon" href="/favicon.ico" sizes="32x32">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="stylesheet" href="styles.css">
<script>
  /* Resolve the theme before first paint so dark mode does not flash light. */
  (function () {
    var mode = localStorage.getItem('riverbend-portal-theme') || 'system';
    var dark = mode === 'dark' || (mode === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
    document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
  })();
</script>
</head>
<body>
<div id="app"></div>
<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
