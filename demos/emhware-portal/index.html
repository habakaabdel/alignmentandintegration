<!DOCTYPE html>
<html lang="en-CA">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Staff portal demonstration, EMHware case management</title>
<meta name="description" content="Demonstration of a clinical staff portal built over the EMHware case management system, by Alignment Integration. Fictional agency, fictional data.">
<meta name="robots" content="index, follow">
<meta name="theme-color" content="#17566B">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 48 48'%3E%3Ccircle cx='24' cy='24' r='22' fill='%2317566B'/%3E%3Cpath d='M8 32c6 0 6-8 12-8s6 8 12 8 8-4 8-4' fill='none' stroke='%23ffffff' stroke-width='3' stroke-linecap='round'/%3E%3Cpath d='M10 20c5 0 5-6 10-6s5 6 10 6 6-3 6-3' fill='none' stroke='%23E0A33E' stroke-width='2.4' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="stylesheet" href="styles.css">
<script>
  /* Resolve the theme before first paint so dark mode does not flash light. */
  (function () {
    var mode = localStorage.getItem('riverbend-portal-theme') || 'system';
    var dark = mode === 'dark' || (mode === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
    document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
  })();
</script>
</head>
<body>
<div id="app"></div>
<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
